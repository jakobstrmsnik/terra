<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Terra</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  color:white;
  font-family:Arial;
}
#info{ position:absolute; top:10px;left:10px;background:rgba(0,0,0,0.6);padding:10px;display:none }
#cross{
  position:absolute;left:50%;top:50%;
  width:6px;height:6px;margin:-3px 0 0 -3px;
  background:white;border-radius:50%;
  display:none;
}
#message{ position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 14px;display:none;}
#menu{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.7);text-align:center;padding-top:120px;box-sizing:border-box}
#menu h1{font-size:50px;margin-bottom:10px}
button{font-size:18px;padding:10px 25px;cursor:pointer}
</style>
</head>
<body>

<div id="info">
Wood: <span id="wood">0</span><br>
Trees planted: <span id="planted">0</span><br>
Green: <span id="percent">0</span>%<br>
Time: <span id="time">0:00.00</span><br>
Best: <span id="best">--</span>
</div>

<div id="cross"></div>
<div id="message"></div>

<div id="menu">
<h1>TERRA</h1>
<p id="menuText">The planet is as dead as a rock. Plant trees until half of it is green!</p>
<p>
WASD = walk, Shift = run, Space = jump<br>
E = chop a tree (you get 1 wood)<br>
Left click = plant a tree (costs 1 wood)<br>
Esc = pause
</p>
<button id="playButton" onclick="pressPlay()">Play</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// I hope its okay, i spent a lot of time doing this. Have a nice day code reviewer! :D
// var size = 50; // i had it smaller first but the map felt too crowded
// changed from 100% green planet to 50%, the game is a bit quicker now

var size = 100
var steps = 50;
var greenRadius = 18

wood = 5;
plantedTrees = 0
percentGreen = 0;
var timegone = 0
var best = 0
var arePlaying = false
var didWin = false

pressed = {}
var lookLeftRight = 0
var lookUpDown = 0;
var me = { x:0, y:0, z:0, vy:0 }
var allTrees = []

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb)
var cam = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
cam.rotation.order = "YXZ" // i found this on a forum, without it looking up makes me turn sideways which was so annoying

var rend = new THREE.WebGLRenderer();
rend.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(rend.domElement)

var light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(50, 100, 30);
scene.add(light)
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// the hills. honestly i dont understand terrain properly so i just did sin and cos
// until it looked like something. sorry if its not okay. if its too smooth i can change the 0.1
function getHeight(xx, zz){
    var h = Math.sin(xx*0.1)*2 + Math.cos(zz*0.1)*2;
    return h
}

var groundGeo = new THREE.PlaneGeometry(size, size, steps, steps);
groundGeo.rotateX(-Math.PI/2)
var pos = groundGeo.attributes.position;
var myColors = new Float32Array(pos.count*3)
var greenArray = [];

for(var i=0; i<pos.count; i++){
   var px = pos.getX(i)
    var pz = pos.getZ(i);
   pos.setY(i, getHeight(px, pz))

  myColors[i*3] = 0.6
    myColors[i * 3 + 1] = 0.4;
   myColors[i*3+2] = 0.3
   greenArray.push(0);
}

groundGeo.setAttribute("color", new THREE.BufferAttribute(myColors, 3));
groundGeo.computeVertexNormals()

var ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({vertexColors:true}));
scene.add(ground);

var trunkShape = new THREE.CylinderGeometry(0.3, 0.4, 2, 6);
var trunkColor = new THREE.MeshLambertMaterial({color:0x6b4a2b});
var leafShape = new THREE.ConeGeometry(1.5, 4, 8);
var leafColor = new THREE.MeshLambertMaterial({color:0x2e7d32})

function addTree(tx, tz){
   var g = new THREE.Group();
  var trunk = new THREE.Mesh(trunkShape, trunkColor);
   trunk.position.y = 1
   g.add(trunk);
  var leafs = new THREE.Mesh(leafShape, leafColor)
   leafs.position.y = 4;
   g.add(leafs)
   g.position.set(tx, getHeight(tx,tz), tz)
   scene.add(g);
   allTrees.push({x:tx, z:tz, mesh:g})
}

for(var k=0;k<10;k++){
   var sx = (Math.random()-0.5)*80
   var sz = (Math.random()-0.5)*80
    if(Math.abs(sx)<5 && Math.abs(sz)<5){
      sx = sx + 10
      sz = sz + 10;
   }
  addTree(sx, sz)
}

me.x = 0;
me.z = 0;
me.y = getHeight(0,0);

function showMsg(msg){
  document.getElementById("message").innerHTML = msg;
  document.getElementById("message").style.display = "block";
  setTimeout(function(){
    document.getElementById("message").style.display = "none";
  }, 2000)
}

function doChop(){
 var found = -1;
 var bestDist = 5;
 for(var i=0;i<allTrees.length;i++){
     var dx = allTrees[i].x - me.x;
     var dz = allTrees[i].z - me.z;
     var d = Math.sqrt(dx*dx+dz*dz)
     if(d < bestDist){
       bestDist = d;
        found = i;
     }
 }
 if(found == -1){
    showMsg("No tree close enough");
    return
 }
 scene.remove(allTrees[found].mesh);
  allTrees.splice(found, 1)
   wood = wood + 1;
}

// this part broke for like two hours because i forgot to set needsUpdate and
// nothing changed color and i thought three js was broken but it was just me
function doPlant(){
  if(wood < 1){
    showMsg("You have no wood! Press E next to a tree");
    return;
  }
   var nx = me.x - Math.sin(lookLeftRight) * 4;
   var nz = me.z - Math.cos(lookLeftRight)*4;
   if(Math.abs(nx)>48 || Math.abs(nz)>48){
      showMsg("That is too far out")
      return
   }
   addTree(nx, nz);
   wood = wood - 1
   plantedTrees++;
   for(var i=0;i<pos.count;i++){
      var dx = pos.getX(i) - nx;
      var dz = pos.getZ(i) - nz
      var d = Math.sqrt(dx*dx + dz*dz)
      if(d < greenRadius){
        greenArray[i] = 1;
      }
   }
   var howMany = 0;
   for(var i=0;i<pos.count;i++){
     if(greenArray[i]==1){
        myColors[i*3] = 0.2;
        myColors[i*3+1] = 0.6;
        myColors[i*3+2] = 0.2;
       howMany = howMany + 1;
      }
   }
   groundGeo.attributes.color.needsUpdate = true
  percentGreen = Math.floor(howMany/pos.count*100)
   if(percentGreen >= 50){
     youWin()
   }
}

function youWin(){
   didWin = true;
   arePlaying = false;
   var str = "You did it! Your time: " + timeToString(timegone);
   if(best == 0 || timegone < best){
      best = timegone;
      str = str + " (new best time!)";
      localStorage.setItem("terraBest", best)
   }else{
      str = str + " (best: " + timeToString(best) + ")"
   }
  document.getElementById("menuText").innerHTML = str
   document.getElementById("playButton").innerHTML = "Play again";
   document.exitPointerLock()
}

function timeToString(sec){
   var mins = Math.floor(sec/60);
  var secs = Math.floor(sec % 60);
   var cents = Math.floor(sec*100 % 100);
   if(secs < 10){ secs = "0" + secs; }
   if(cents < 10){ cents = "0" + cents; }
  return mins + ":" + secs + "." + cents;
}

function updateHUD(){
   document.getElementById("wood").innerHTML = wood;
   document.getElementById("planted").innerHTML = plantedTrees;
   document.getElementById("percent").innerHTML = percentGreen
   document.getElementById("time").innerHTML = timeToString(timegone);
   if(best>0){
     document.getElementById("best").innerHTML = timeToString(best);
   }
}

// jumping was the hardest thing, i had to look at a physics video to get why
// the gravity has to be multiplied by delta
function move(delta){
  var spd = 8;
   if(pressed["ShiftLeft"]==true){
     spd = 14;
   }
  var fwd = 0;
  var right = 0
   if(pressed["KeyW"]){ fwd = fwd + 1 }
   if(pressed["KeyS"]){ fwd = fwd - 1 }
   if(pressed["KeyD"]){ right = right + 1 }
  if(pressed["KeyA"]){ right = right - 1 }
  me.x = me.x + (-Math.sin(lookLeftRight) * fwd + Math.cos(lookLeftRight) * right) * spd * delta;
  me.z = me.z + (-Math.cos(lookLeftRight) * fwd - Math.sin(lookLeftRight)*right) * spd*delta;
   if(me.x > 48){ me.x = 48 }
  if(me.x < -48){ me.x = -48; }
   if(me.z > 48){ me.z = 48 }
   if(me.z < -48){me.z = -48}
   var gy = getHeight(me.x, me.z)
   var grounded = me.y <= gy + 0.01;
   if(pressed["Space"] && grounded){
      me.vy = 9
   }
   me.vy = me.vy - 25*delta
   me.y = me.y + me.vy * delta;
   if(me.y < gy){
     me.y = gy;
      me.vy = 0;
   }
}

document.addEventListener("keydown", function(e){
   pressed[e.code] = true;
   if(arePlaying==true && e.code=="KeyE"){
      doChop()
   }
})

document.addEventListener("keyup", function(e){
   pressed[e.code] = false
})

document.addEventListener("mousedown", function(e){
   if(arePlaying && e.button==0){
      doPlant();
   }
})

document.addEventListener("mousemove", function(e){
   if(arePlaying){
      lookLeftRight = lookLeftRight - e.movementX*0.002;
      lookUpDown = lookUpDown - e.movementY * 0.002
      if(lookUpDown > 1.5){ lookUpDown = 1.5 }
      if(lookUpDown < -1.5){ lookUpDown = -1.5; }
   }
})

window.addEventListener("resize", function(){
   cam.aspect = window.innerWidth/window.innerHeight
  cam.updateProjectionMatrix();
   rend.setSize(window.innerWidth, window.innerHeight);
})

function pressPlay(){
   if(didWin==true){
      location.reload() // easier than resetting everything, i will fix this later
   }else{
     rend.domElement.requestPointerLock()
   }
}

document.addEventListener("pointerlockchange", function(){
   if(document.pointerLockElement == rend.domElement){
      arePlaying = true
      document.getElementById("menu").style.display = "none";
     document.getElementById("info").style.display = "block";
     document.getElementById("cross").style.display = "block";
   }else{
     arePlaying = false;
      document.getElementById("menu").style.display = "block";
      document.getElementById("info").style.display = "none";
      document.getElementById("cross").style.display = "none";
      if(didWin==true){
        document.getElementById("playButton").innerHTML = "Play again";
      }else{
        document.getElementById("playButton").innerHTML = "Continue";
      }
   }
})

var savedBest = localStorage.getItem("terraBest")
if(savedBest){
   best = parseInt(savedBest);
}

var prevTime = Date.now();

function loop(){
  requestAnimationFrame(loop)
  var t = Date.now()
  var delta = (t - prevTime)/1000;
   prevTime = t;
   if(delta > 0.1){
     delta = 0.1;
   }
  if(arePlaying){
    timegone = timegone + delta
     move(delta)
     updateHUD()
  }
   cam.position.set(me.x, me.y + 1.7, me.z);
   cam.rotation.y = lookLeftRight
  cam.rotation.x = lookUpDown
  rend.render(scene, cam)
}
//thats it! (found out i cant put this message this all the way down haha)
loop()
</script>
</body>
</html>
